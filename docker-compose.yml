services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - coffee_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER}
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  coffee_data:
  redis_data:
