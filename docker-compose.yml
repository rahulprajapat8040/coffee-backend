services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - coffee_data:/var/lib/postgresql/data

volumes:
  coffee_data:
